<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giftboxby.m.a</title>

<style>
body{
font-family: Arial, sans-serif;
background:#f6f6f6;
margin:0;
padding:15px;
}
.card{
background:#fff;
border-radius:12px;
padding:15px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
.logo{
width:90px;
height:90px;
border-radius:50%;
display:block;
margin:0 auto 10px;
}
.preview{
width:100%;
max-width:220px;
border-radius:12px;
margin:8px auto;
display:block;
}
label{
display:block;
margin-top:10px;
}
select, button{
width:100%;
padding:10px;
margin-top:5px;
}
.small{
font-size:14px;
color:#777;
}
</style>
</head>

<body>

<!-- PROFIL -->
<div class="card">
<img src="profil.jpg" class="logo">
<h2 style="text-align:center">Giftboxby.m.a</h2>
<p class="small" style="text-align:center">
Handgjort • Personligt • Instagram-style
</p>
</div>

<!-- BILDER -->
<div class="card">
<b>Våra boxar</b>
<img src="15cm.jpg" class="preview">
<img src="20cm.jpg" class="preview">
<img src="25cm.jpg" class="preview">
</div>

<!-- TILLÄGG -->
<div class="card">
<b>Tillägg</b>
<img src="rosnalle.jpg" class="preview">
<p class="small">Rosnalle / blomma med nalle</p>
</div>

<!-- BESTÄLLNING -->
<div class="card">
<label>Form</label>
<select id="form">
<option>Hjärta</option>
<option>Cirkel</option>
</select>

<label>Storlek</label>
<select id="storlek">
<option value="169">15 cm – 169 kr</option>
<option value="229">20 cm – 229 kr</option>
<option value="299">25 cm – 299 kr</option>
</select>

<label>Färg</label>
<select>
<option>Röd</option>
<option>Vinröd</option>
<option>Vit</option>
<option>Lila</option>
<option>Rosa</option>
<option>Svart</option>
<option>Ljusblå</option>
</select>

<label>Tillägg</label>
<select>
<option>Inget</option>
<option>Rosnalle +15 kr</option>
</select>

<button>Skicka beställning</button>
</div>

</body>
</html>
